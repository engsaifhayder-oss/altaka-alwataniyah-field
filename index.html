<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#002816">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الموظف الميداني">
<link rel="apple-touch-icon" href="icon-180.png">
<title>الموظف الميداني – الطاقة الوطنية</title>
<style>
:root{--dk:#002816;--dk2:#0b4a2c;--lime:#97d214;--bg:#f2f5f1;--card:#fff;--ink:#0f1c15;--mut:#4d5d54;--line:#d9e2db;--err:#b3261e;--warn:#a86200;--ok:#1d7a3a;
--f:"Cairo","Noto Kufi Arabic","Noto Sans Arabic","Segoe UI","SF Arabic",Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px}
header{background:var(--dk);color:#fff;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
header .in{max-width:720px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:58px}
header .bk{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;display:grid;place-items:center;flex-shrink:0}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sync{font-size:12px;background:rgba(255,255,255,.12);padding:5px 10px;border-radius:20px;white-space:nowrap}
header .sync.off{background:#7a1d16}
header .sync.pend{background:var(--lime);color:var(--dk);font-weight:700}
.logo{background:#fff;text-align:center;padding:10px;border-bottom:4px solid var(--lime)}
.logo img{height:44px;max-width:100%}
main{max-width:720px;margin:auto;padding:14px 12px 120px}
.screen{display:none}.screen.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:14px;overflow:hidden}
.card h2{margin:0;font-size:16px;padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);color:var(--dk)}
.card h2 .n{width:28px;height:28px;border-radius:9px;background:var(--dk);color:var(--lime);display:grid;place-items:center;font-size:14px;flex-shrink:0}
.card h2 .n.done{background:var(--lime);color:var(--dk)}
.body{padding:12px 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:14px;color:var(--mut);margin-bottom:4px;font-weight:700}
input,textarea,select{width:100%;font:inherit;font-size:17px;padding:11px 12px;border:1px solid #c3cfc6;border-radius:11px;background:#fbfdfb;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--lime);border-color:var(--dk2)}
textarea{min-height:90px;resize:vertical}
.req::after{content:" *";color:var(--err)}
.unit{position:relative}.unit span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px}
.btn{font:inherit;border:0;border-radius:13px;padding:13px 14px;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.btn.pri{background:var(--lime);color:var(--dk)}
.btn.dk{background:var(--dk);color:#fff}
.btn.sec{background:#fff;color:var(--dk);border:1px solid #c3cfc6}
.btn.red{background:#fff;color:var(--err);border:1px solid #efc2be}
.btn.w{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}
.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:720px;margin:auto;display:flex;gap:8px}.bar .btn{flex:1}
.hidden{display:none!important}
.mut{color:var(--mut);font-size:14px;line-height:1.7}
.hint{margin:0 0 10px;font-size:14px;color:var(--dk2);background:#eef6e0;border-inline-start:4px solid var(--lime);padding:8px 10px;border-radius:9px;line-height:1.7}
.warnbox{margin:8px 0;font-size:14px;color:#7a1d16;background:#fdecea;border-inline-start:4px solid var(--err);padding:8px 10px;border-radius:9px;line-height:1.7}
.okbox{margin:8px 0;font-size:14px;color:var(--ok);background:#e6f5ea;border-inline-start:4px solid var(--ok);padding:8px 10px;border-radius:9px;line-height:1.7}
.hello{background:var(--dk);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.hello b{font-size:19px;display:block}.hello small{color:#cfe3d4}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:13px;background:rgba(255,255,255,.14);border-radius:20px;padding:4px 10px}
.chip.lime{background:var(--lime);color:var(--dk);font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;text-align:right;font:inherit;color:var(--ink);cursor:pointer;min-height:92px}
.tile .i{font-size:26px}.tile b{display:block;font-size:15px;margin-top:4px}.tile small{color:var(--mut);font-size:12px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;display:block;width:100%;text-align:right;font:inherit;color:var(--ink)}
.tcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tcard b{font-size:16px}
.pill{display:inline-block;font-size:12px;padding:3px 10px;border-radius:20px;background:#e8efe9;color:var(--dk2);white-space:nowrap;font-weight:700}
.pill.ins{background:#e4eefb;color:#174a8b}.pill.exe{background:#fff1dc;color:#8a4b00}.pill.ok{background:#e3f4e8;color:var(--ok)}.pill.bad{background:#fde8e6;color:var(--err)}
.prog{display:flex;gap:4px;margin-top:10px}.prog span{flex:1;height:7px;border-radius:4px;background:#e0e7e1}.prog span.on{background:var(--lime)}
.next{font-size:13px;color:var(--dk2);margin-top:6px}
.steplist .st{display:flex;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.steplist .st:last-child{border-bottom:0}
.steplist .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:#e0e7e1;color:var(--mut);flex-shrink:0}
.steplist .st.done .dot{background:var(--lime);color:var(--dk)}
.steplist .st.cur .dot{background:var(--dk);color:#fff}
.steplist .st .t{flex:1}.steplist .st small{display:block;color:var(--mut);font-size:12px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:15px}.kv div:nth-child(odd){color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;background:#e7ece8}
.th img,.th video{width:100%;height:100%;object-fit:cover}
.th button{position:absolute;top:5px;left:5px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;padding:0}
.th span{position:absolute;bottom:4px;right:5px;left:5px;background:rgba(0,40,22,.85);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;text-align:center}
.selfie{width:150px;height:150px;border-radius:16px;object-fit:cover;border:3px solid var(--lime);display:block;margin:0 auto 10px}
.choice{display:flex;flex-wrap:wrap;gap:6px}
.choice button{font:inherit;font-size:15px;border:1px solid #c3cfc6;background:#fff;border-radius:10px;padding:9px 14px;color:var(--ink)}
.choice button.on{background:var(--dk);color:#fff;border-color:var(--dk)}
.eq{display:grid;grid-template-columns:1fr 80px 36px;gap:6px;align-items:center;margin-bottom:8px}
.eq.r{grid-template-columns:1fr 70px 100px}
.eq input,.eq select{padding:9px;font-size:15px}
.eq .x{border:0;background:#fde8e6;color:var(--err);border-radius:9px;height:40px;font-size:18px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:#fcfefb}
.item .t{font-weight:700;font-size:15px;margin-bottom:8px;color:var(--dk2)}
.item .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item input{padding:9px;font-size:15px}
.log{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.log:last-child{border-bottom:0}.log .i{font-size:20px}.log .t{flex:1}.log small{display:block;color:var(--mut);font-size:12px}
.flag{display:block;color:var(--err);font-size:12px}
.ov{position:fixed;inset:0;background:rgba(0,20,10,.6);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:#fff;border-radius:18px;max-width:440px;width:100%;padding:18px;max-height:88vh;overflow:auto}
.dlg h3{margin:0 0 8px;font-size:18px;color:var(--dk)}
.dlg p{margin:0 0 14px;color:var(--mut);font-size:15px;line-height:1.7}
.spin{width:40px;height:40px;border:4px solid #e3ebe5;border-top-color:var(--lime);border-radius:50%;animation:s 1s linear infinite;margin:6px auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--dk);color:#fff;padding:11px 18px;border-radius:12px;font-size:15px;z-index:60;max-width:92%;text-align:center}
.foot{text-align:center;color:var(--mut);font-size:12px;line-height:1.8;margin-top:10px}
.demo{background:#fff3df;color:#8a4b00;text-align:center;font-size:13px;padding:6px;font-weight:700}
/* الكاميرا */
.cam{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:cover;min-height:0}
.cam video.mirror{transform:scaleX(-1)}
.camtop{position:absolute;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;background:linear-gradient(#000a,#0000);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.rec{background:#d32f2f;color:#fff;border-radius:20px;padding:3px 12px;font-size:14px}
.camstamp{position:absolute;bottom:130px;right:12px;left:12px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000;line-height:1.6}
.cambar{display:flex;justify-content:space-around;align-items:center;padding:18px 12px calc(18px + env(safe-area-inset-bottom));background:#000}
.cambar button{font:inherit;color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:12px;padding:10px 14px;font-size:15px;min-width:80px}
.cambar .shot{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid var(--lime);min-width:0;padding:0}
.cambar .shot.vid{background:#d32f2f}
.cambar .shot.stop{background:#fff;border-radius:18px;width:64px;height:64px;border-color:#d32f2f}
.scanbox{position:absolute;top:50%;left:50%;width:90%;height:22%;transform:translate(-50%,-50%);border:3px solid var(--lime);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
@media(max-width:360px){.grid{grid-template-columns:1fr}.tiles{grid-template-columns:1fr 1fr}}
</style>
</head>

<header><div class="in">
  <button class="bk hidden" id="backBtn" aria-label="رجوع">→</button>

</div></header>
<div id="demoBar" class="demo hidden">وضع تجريبي – البيانات لا تُرسل إلى النظام</div>

<script>
/* قارئ باركود Code 128 بلغة JavaScript (للآيفون والويندوز – بدون مكتبات) */
const C128D=(()=>{
const P='212222 222122 222221 121223 121322 131222 122213 122312 132212 221213 221312 231212 112232 122132 122231 113222 123122 123221 223211 221132 221231 213212 223112 312131 311222 321122 321221 312212 322112 322211 212123 212321 232121 111323 131123 131321 112313 132113 132311 211313 231113 231311 112133 112331 132131 113123 113321 133121 313121 211331 231131 213113 213311 213131 311123 311321 331121 312113 312311 332111 314111 221411 431111 111224 111422 121124 121421 141122 141221 112214 112412 122114 122411 142112 142211 241211 221114 413111 241112 134111 111242 121142 121241 114212 124112 124211 411212 421112 421211 212141 214121 412121 111143 111341 131141 114113 114311 411113 411311 113141 114131 311141 411131 211412 211214 211232 233111'.split(' ').map(s=>[...s].map(Number));
// أقرب رمز لستة أطوال متتالية (خط/فراغ) بعد تطبيعها إلى 11 وحدة
function best(r,i){if(i+6>r.length)return [-1,99];let t=0;for(let k=0;k<6;k++)t+=r[i+k];if(!t)return [-1,99];const u=t/11;let bi=-1,be=99;
  const n=[0,0,0,0,0,0];for(let k=0;k<6;k++)n[k]=r[i+k]/u;
  for(let c=0;c<107;c++){const p=P[c];let e=0;for(let k=0;k<6;k++)e+=Math.abs(n[k]-p[k])*0.4;for(let k=0;k<5;k++)e+=Math.abs(n[k]+n[k+1]-p[k]-p[k+1])*0.6;if(e<be){be=e;bi=c}}return [bi,be]}
function text(vals){let set=vals[0]===103?'A':vals[0]===104?'B':'C',out='';
  for(let k=1;k<vals.length;k++){const v=vals[k];
    if(set==='C'){if(v<100)out+=String(v).padStart(2,'0');else if(v===100)set='B';else if(v===101)set='A'}
    else if(set==='B'){if(v<96)out+=String.fromCharCode(v+32);else if(v===99)set='C';else if(v===101)set='A'}
    else{if(v<64)out+=String.fromCharCode(v+32);else if(v<96)out+=String.fromCharCode(v-64);else if(v===99)set='C';else if(v===100)set='B'}}
  return out}
// r = [فراغ, خط, فراغ, خط, ...]
function decodeRuns(r){
  for(let s=1;s+6<r.length;s+=2){const [c,e]=best(r,s);if(c<103||c>105||e>1.5)continue;
    let t=0;for(let k=0;k<6;k++)t+=r[s+k];if(r[s-1]<t/11*4)continue; // منطقة هادئة
    const vals=[c];let i=s+6,ok=false;
    while(i+6<=r.length){const [v,err]=best(r,i);if(v<0||err>1.7)break;if(v===106){ok=true;break}vals.push(v);i+=6}
    if(!ok||vals.length<3)continue;
    const chk=vals.pop();let sum=vals[0];for(let k=1;k<vals.length;k++)sum+=vals[k]*k;if(sum%103!==chk)continue;
    return text(vals)}
  return null}
function scanLine(g,w){let mn=255,mx=0;for(let x=0;x<w;x++){if(g[x]<mn)mn=g[x];if(g[x]>mx)mx=g[x]}if(mx-mn<35)return null;
  const win=Math.max(9,Math.round(w/20))|1,h=win>>1,pre=new Float64Array(w+1);for(let x=0;x<w;x++)pre[x+1]=pre[x]+g[x];
  const mid=(mn+mx)/2,f=new Float32Array(w);
  for(let x=0;x<w;x++){const a=Math.max(0,x-h),b=Math.min(w,x+h+1),m=(pre[b]-pre[a])/(b-a);f[x]=g[x]-(m*0.6+mid*0.4)} // سالب = خط
  // حدود الخطوط بدقة أقل من البكسل
  const r=[];let last=0,dark=f[0]<0;if(dark)r.push(0);
  for(let x=0;x<w-1;x++){const d1=f[x]<0,d2=f[x+1]<0;if(d1!==d2){const pos=x+f[x]/(f[x]-f[x+1]);r.push(pos-last);last=pos}}
  r.push(w-last);if(r.length%2===0)r.push(0);
  return decodeRuns(r)||decodeRuns(r.slice().reverse())}
const cv=document.createElement('canvas');const cx=cv.getContext('2d',{willReadFrequently:true});
/** يقرأ الباركود من فيديو/صورة/لوحة. يرجع النص أو null */
function decode(src){const sw=src.videoWidth||src.naturalWidth||src.width,sh=src.videoHeight||src.naturalHeight||src.height;if(!sw||!sh)return null;
  const W=Math.min(1280,sw),H=Math.max(1,Math.round(sh*W/sw));cv.width=W;cv.height=H;cx.drawImage(src,0,0,W,H);
  const g=new Float32Array(W),seen={};
  for(let k=0;k<=30;k++){const y=Math.round(H*(0.5+(k%2?1:-1)*Math.ceil(k/2)*0.012));if(y<0||y>=H)continue;
    const y0=Math.max(0,y-2),n=Math.min(5,H-y0);const d=cx.getImageData(0,y0,W,n).data;g.fill(0);for(let j=0;j<n;j++){const o=j*W*4;for(let x=0;x<W;x++)g[x]+=(d[o+x*4]*.299+d[o+x*4+1]*.587+d[o+x*4+2]*.114)/n}
    const t=scanLine(g,W);if(t){seen[t]=(seen[t]||0)+1;if(seen[t]>=2)return t}}
  return null}
return {decode,decodeRuns,scanLine};
})();

</script>
<script>
"use strict";
/* ================= أدوات عامة ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NB=window.AndroidBridge||null;
const IS_DESKTOP=/Electron/i.test(navigator.userAgent);
const IS_IOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const LS={get(k,d){try{const v=localStorage.getItem('nef_'+k);return v==null?d:JSON.parse(v)}catch(_){return d}},set(k,v){try{localStorage.setItem('nef_'+k,JSON.stringify(v))}catch(e){toast('مساحة التخزين ممتلئة')}},del(k){localStorage.removeItem('nef_'+k)}};
const rid=p=>(p||'c')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);
let cfg=LS.get('cfg',{});if(!cfg.deviceId){cfg.deviceId=rid('dev');LS.set('cfg',cfg)}
let boot=LS.get('boot',null);
let clock=LS.get('clock',null);
function saveCfg(){LS.set('cfg',cfg)}
function toast(m,ms){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2800)}
let dlgOpen=false;
function dlg(html){closeDlg();const o=document.createElement('div');o.className='ov';o.id='dlg';o.innerHTML=`<div class="dlg">${html}</div>`;document.body.appendChild(o);dlgOpen=true;return o}
function closeDlg(){const o=$('#dlg');if(o)o.remove();dlgOpen=false}
function busy(msg){return dlg(`<div class="spin"></div><p style="text-align:center">${esc(msg)}</p>`)}
function alertDlg(t,m,btn){return new Promise(r=>{dlg(`<h3>${t}</h3><p>${m}</p><button class="btn pri w" id="dOk">${btn||'حسناً'}</button>`);$('#dOk').onclick=()=>{closeDlg();r()}})}
function confirmDlg(t,m,yes,no){return new Promise(r=>{dlg(`<h3>${t}</h3><p>${m}</p><div class="row"><button class="btn pri" id="dY">${yes||'نعم'}</button><button class="btn sec" id="dN">${no||'إلغاء'}</button></div>`);$('#dY').onclick=()=>{closeDlg();r(true)};$('#dN').onclick=()=>{closeDlg();r(false)}})}

/* ================= الوقت الموثوق ================= */
// يعتمد على ساعة الخادم + عدّاد الجهاز منذ التشغيل (لا يتأثر بتغيير ساعة الهاتف)
function elapsedNow(){try{return NB&&NB.elapsed?Number(NB.elapsed()):null}catch(_){return null}}
function setClock(serverIso,t0,t1){const s=Date.parse(serverIso)+(t1-t0)/2;clock={server:s,elapsed:elapsedNow(),offset:s-t1,at:t1};LS.set('clock',clock)}
function nowC(){if(clock){const e=elapsedNow();if(e!=null&&clock.elapsed!=null&&e>=clock.elapsed)return clock.server+(e-clock.elapsed);return Date.now()+clock.offset}return Date.now()}
const TZ='Asia/Baghdad';
function fmtDT(ms){const d=new Date(ms);return d.toLocaleDateString('en-CA',{timeZone:TZ})+'  '+d.toLocaleTimeString('en-GB',{timeZone:TZ})}
function fmtAr(iso){if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('ar-IQ',{timeZone:TZ,day:'numeric',month:'short'})+' – '+d.toLocaleTimeString('ar-IQ',{timeZone:TZ,hour:'2-digit',minute:'2-digit'})}
function todayStr(){return new Date(nowC()).toLocaleDateString('en-CA',{timeZone:TZ})}

/* ================= التخزين الداخلي (IndexedDB) ================= */
const IDB={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open('nef_field',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('outbox',{keyPath:'id'});d.createObjectStore('drafts',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async run(store,mode,fn){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction(store,mode);const q=fn(t.objectStore(store));let out;if(q)q.onsuccess=()=>out=q.result;t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  put(s,v){return this.run(s,'readwrite',o=>o.put(v))},get(s,k){return this.run(s,'readonly',o=>o.get(k))},
  del(s,k){return this.run(s,'readwrite',o=>o.delete(k))},all(s){return this.run(s,'readonly',o=>o.getAll())}};

async function sha256(blob){const b=await blob.arrayBuffer();const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ================= الاتصال بالخادم ================= */
function normServer(s){s=String(s||'').trim().replace(/\/+$/,'');if(s&&!/^https?:\/\//i.test(s))s='http://'+s;return s}
async function fetchT(url,opt,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||20000);try{return await fetch(url,Object.assign({},opt,{signal:c.signal}))}finally{clearTimeout(t)}}
async function apiJson(path,opt){opt=opt||{};const h=Object.assign({'Authorization':'Bearer '+(cfg.token||'')},opt.headers||{});
  const r=await fetchT(cfg.server+path,Object.assign({},opt,{headers:h}),opt.ms||20000);const j=await r.json().catch(()=>({}));
  if(r.status===401&&cfg.token){sessionExpired();throw new Error('انتهت الجلسة')}
  if(!r.ok)throw new Error(j.message||('خطأ '+r.status));return j}
async function refresh(silent){if(cfg.demo||!cfg.token)return false;try{const t0=Date.now();const j=await apiJson('/api/mobile/bootstrap');setClock(j.serverTime,t0,Date.now());boot=j;LS.set('boot',boot);return true}catch(e){if(!silent)toast('تعذّر تحديث المهام: '+e.message);return false}}
function sessionExpired(){cfg.token=null;saveCfg();toast('انتهت الجلسة – سجّل الدخول مجدداً. البيانات المحفوظة لن تُفقد',4500);stack=[];show('sLogin',false)}

/* ================= صندوق الإرسال (يعمل بدون إنترنت) ================= */
function logAll(){return LS.get('log',[])}
function logAdd(e){const l=logAll();l.unshift(e);LS.set('log',l.slice(0,400))}
function logUpd(id,p){const l=logAll();const x=l.find(q=>q.id===id);if(x)Object.assign(x,p);LS.set('log',l)}
async function queue(kind,meta,files,title,icon){
  const id=meta.clientId||rid(kind.slice(0,2));meta.clientId=id;meta.createdAt=new Date(nowC()).toISOString();meta.deviceTime=meta.deviceTime||new Date().toISOString();
  meta.hashes=meta.hashes||{};for(const f of files){if(!f.hash)f.hash=await sha256(f.blob);meta.hashes[f.name]=f.hash}
  await IDB.put('outbox',{id,kind,meta,files:files.map(f=>({field:f.field,name:f.name,blob:f.blob})),owner:cfg.employee&&cfg.employee.code,createdAt:meta.createdAt,tries:0});
  logAdd({id,kind,title,icon:icon||'📄',at:meta.createdAt,status:'pending',flags:[],taskId:meta.taskId||null});
  updChip();setTimeout(sync,300);return id}
let syncing=false;
async function pendingCount(){try{return (await IDB.all('outbox')).length}catch(_){return 0}}
async function sync(manual){
  if(syncing)return;if(cfg.demo){if(manual)toast('الوضع التجريبي لا يرسل البيانات');return}
  if(!cfg.token||!cfg.server)return;syncing=true;updChip();let sent=0,failed=false;
  try{const items=(await IDB.all('outbox')).filter(i=>!i.owner||!cfg.employee||i.owner===cfg.employee.code).sort((a,b)=>a.createdAt<b.createdAt?-1:1);
    for(const it of items){const fd=new FormData();fd.append('meta',JSON.stringify(it.meta));it.files.forEach(f=>fd.append(f.field,f.blob,f.name));
      let r;try{r=await fetchT(cfg.server+'/api/mobile/'+it.kind,{method:'POST',headers:{'Authorization':'Bearer '+cfg.token},body:fd},15*60000)}catch(e){failed=true;break}
      if(r.status===401){sessionExpired();failed=true;break}
      if(!r.ok){it.tries++;it.lastError=r.status;await IDB.put('outbox',it);logUpd(it.id,{status:'error'});if(r.status>=500){failed=true;break}continue}
      const j=await r.json().catch(()=>({}));await IDB.del('outbox',it.id);logUpd(it.id,{status:'sent',flags:j.flags||[],sentAt:new Date().toISOString()});sent++}
  }finally{syncing=false;updChip()}
  if(sent){if(manual||sent>0)toast('تم إرسال '+sent+' سجل إلى النظام ✓');refresh(true).then(()=>{if(cur()==='sHome')renderHome()})}
  else if(manual)toast(failed?'لا يوجد اتصال بالخادم – ستُرسل البيانات تلقائياً لاحقاً':'لا توجد بيانات بانتظار الإرسال');
}
async function updChip(){const n=await pendingCount();const c=$('#syncChip');if(!cfg.employee&&!cfg.demo){c.className='sync';c.textContent='';c.classList.add('hidden');return}
  c.classList.remove('hidden');if(syncing){c.className='sync pend';c.textContent='جارٍ الإرسال…';return}
  if(!navigator.onLine){c.className='sync off';c.textContent=n?'غير متصل · '+n:'غير متصل';return}
  c.className='sync'+(n?' pend':'');c.textContent=n?n+' بانتظار الإرسال':'متزامن ✓'}
window.addEventListener('online',()=>{updChip();sync()});window.addEventListener('offline',updChip);
setInterval(()=>sync(),45000);

/* ================= الأمان والتحقق ================= */
function integrity(){const o={source:'live-camera',platform:NB?'android-app':'web'};try{if(NB&&NB.integrity)Object.assign(o,JSON.parse(NB.integrity()))}catch(_){}return o}
function deviceStr(){try{if(NB&&NB.device)return NB.device()}catch(_){}return navigator.userAgent.slice(0,160)}
function getGps(maxMs){maxMs=maxMs||15000;return new Promise(res=>{if(!navigator.geolocation)return res({error:'unsupported'});let best=null,done=false,w=null;
  const fin=()=>{if(done)return;done=true;try{navigator.geolocation.clearWatch(w)}catch(_){}clearTimeout(tm);res(best||{error:'timeout'})};
  w=navigator.geolocation.watchPosition(p=>{const c=p.coords;if(!best||best.error||c.accuracy<best.accuracy)best={lat:+c.latitude.toFixed(7),lng:+c.longitude.toFixed(7),accuracy:Math.round(c.accuracy),altitude:c.altitude,at:new Date(p.timestamp).toISOString()};if(c.accuracy<=25)fin()},
    e=>{if(e.code===1){best={error:'denied'};fin()}},{enableHighAccuracy:true,maximumAge:0,timeout:maxMs});const tm=setTimeout(fin,maxMs)})}
function distM(a,b,c,d){if([a,b,c,d].some(v=>v==null||isNaN(v)))return null;const R=6371000,r=Math.PI/180;const x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(x)))}
function gpsTxt(g){return g&&g.lat!=null?`${g.lat.toFixed(5)}, ${g.lng.toFixed(5)}  ±${g.accuracy}m`:'الموقع غير متوفر'}

/* ================= الكاميرا (داخل التطبيق حصراً) ================= */
const CAM={stream:null,rec:null,raf:0,timer:0,resolve:null,reject:null,opts:null,facing:'user',chunks:[],t0:0,scanIv:0};
function camLines(o,extra){const e=cfg.employee||{};const L=['الطاقة الوطنية – ALTAKA-ALWATANIYAH',(e.name||'')+(e.code?'  #'+e.code:''),o.label||'',fmtDT(nowC())+'  (بغداد)',gpsTxt(o.gps)];if(extra)L.push(extra);return L.filter(Boolean)}
function drawStamp(ctx,W,H,lines){const fs=Math.max(14,Math.round(W/42));const lh=fs*1.45;const bh=lh*lines.length+fs*.9;
  ctx.fillStyle='rgba(0,40,22,.72)';ctx.fillRect(0,H-bh,W,bh);ctx.fillStyle='#97d214';ctx.fillRect(0,H-bh,W,Math.max(3,fs/5));
  ctx.fillStyle='#fff';ctx.font=`bold ${fs}px Cairo, "Noto Sans Arabic", Tahoma, sans-serif`;ctx.direction='rtl';ctx.textAlign='right';ctx.textBaseline='top';
  lines.forEach((t,i)=>ctx.fillText(t,W-fs*.7,H-bh+fs*.5+i*lh))}
async function camStart(facing,audio,hi){camStop(true);
  const v={facingMode:{ideal:facing},width:{ideal:hi?1920:1280},height:{ideal:hi?1080:960}};
  CAM.stream=await navigator.mediaDevices.getUserMedia({video:v,audio:!!audio});CAM.facing=facing;
  const vid=$('#camV');vid.srcObject=CAM.stream;vid.classList.toggle('mirror',facing==='user');await vid.play().catch(()=>{});
  await new Promise(r=>{if(vid.videoWidth)return r();vid.onloadedmetadata=()=>r();setTimeout(r,2500)})}
function camStop(keepUi){cancelAnimationFrame(CAM.raf);clearInterval(CAM.timer);clearInterval(CAM.scanIv);
  if(CAM.rec&&CAM.rec.state!=='inactive'){try{CAM.rec.onstop=null;CAM.rec.stop()}catch(_){}}CAM.rec=null;
  if(CAM.stream){CAM.stream.getTracks().forEach(t=>t.stop());CAM.stream=null}
  if(!keepUi){$('#cam').classList.add('hidden');$('#camV').srcObject=null;$('#scanBox').classList.add('hidden');$('#camRec').classList.add('hidden')}}
function closeCam(){camStop();if(CAM.reject){CAM.reject(new Error('cancel'));CAM.reject=CAM.resolve=null}}
$('#camX').onclick=closeCam;
function camErr(e){camStop();const m=e&&e.name==='NotAllowedError'?'يرجى السماح للتطبيق باستخدام الكاميرا والمايكروفون من إعدادات الهاتف.':'تعذّر تشغيل الكاميرا: '+(e&&e.message||e);alertDlg('الكاميرا',m)}
/** التقاط صورة مباشرة. o={facing,label,gps,title} */
function capturePhoto(o){return new Promise(async(resolve,reject)=>{CAM.resolve=resolve;CAM.reject=reject;CAM.opts=o;
  $('#cam').classList.remove('hidden');$('#camTitle').textContent=o.title||'التقاط صورة';$('#camShot').className='shot';$('#camFlip').classList.toggle('hidden',o.facing==='user');$('#camSp').classList.toggle('hidden',o.facing!=='user');
  const upd=()=>{$('#camStamp').innerHTML=camLines(o).map(esc).join('<br>')};upd();CAM.timer=setInterval(upd,1000);
  try{await camStart(o.facing||'environment')}catch(e){CAM.reject=null;camErr(e);return reject(e)}
  $('#camFlip').onclick=async()=>{try{await camStart(CAM.facing==='user'?'environment':'user')}catch(e){camErr(e)}};
  $('#camShot').onclick=async()=>{const vid=$('#camV');const vw=vid.videoWidth||1280,vh=vid.videoHeight||960;const sc=Math.min(1,1600/Math.max(vw,vh));
    const W=Math.round(vw*sc),H=Math.round(vh*sc);const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
    if(CAM.facing==='user'){ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(vid,0,0,W,H);ctx.restore()}else ctx.drawImage(vid,0,0,W,H);
    const at=nowC();drawStamp(ctx,W,H,camLines(o));
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.84));camStop();const res=CAM.resolve;CAM.resolve=CAM.reject=null;
    const hash=await sha256(blob);res({blob,hash,at:new Date(at).toISOString(),type:'image/jpeg',w:W,h:H,facing:CAM.facing})};
})}
/** تسجيل فيديو مباشر مع ختم الوقت والموقع لحظة بلحظة. o={label,gps,maxSec} */
function recordVideo(o){return new Promise(async(resolve,reject)=>{CAM.resolve=resolve;CAM.reject=reject;CAM.opts=o;const maxSec=o.maxSec||90;
  $('#cam').classList.remove('hidden');$('#camTitle').textContent=o.title||'تسجيل فيديو';$('#camShot').className='shot vid';$('#camFlip').classList.remove('hidden');$('#camSp').classList.add('hidden');
  $('#camStamp').innerHTML=camLines(o,'اضغط الزر الأحمر لبدء التسجيل (حتى '+maxSec+' ثانية)').map(esc).join('<br>');
  try{await camStart('environment',true)}catch(e){CAM.reject=null;camErr(e);return reject(e)}
  $('#camFlip').onclick=async()=>{if(CAM.rec)return;try{await camStart(CAM.facing==='user'?'environment':'user',true)}catch(e){camErr(e)}};
  $('#camShot').onclick=()=>{if(CAM.rec){CAM.rec.stop();return}startRec()};
  function startRec(){const vid=$('#camV');const vw=vid.videoWidth||1280,vh=vid.videoHeight||720;const sc=Math.min(1,960/Math.max(vw,vh));
    const W=Math.round(vw*sc/2)*2,H=Math.round(vh*sc/2)*2;const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
    CAM.t0=nowC();const mirror=CAM.facing==='user';
    const draw=()=>{if(mirror){ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(vid,0,0,W,H);ctx.restore()}else ctx.drawImage(vid,0,0,W,H);
      const el=Math.floor((nowC()-CAM.t0)/1000);drawStamp(ctx,W,H,camLines(o,'● تسجيل مباشر  '+String(Math.floor(el/60)).padStart(2,'0')+':'+String(el%60).padStart(2,'0')));CAM.raf=requestAnimationFrame(draw)};draw();
    let out;if(c.captureStream){out=c.captureStream(24);CAM.stream.getAudioTracks().forEach(t=>out.addTrack(t))}else{out=CAM.stream} // بعض نسخ iOS: يُسجّل البث المباشر ويُحفظ الوقت والموقع كبيانات
    const types=['video/webm;codecs=vp8,opus','video/webm;codecs=vp9,opus','video/webm','video/mp4'];const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    try{CAM.rec=new MediaRecorder(out,{mimeType:mt||undefined,videoBitsPerSecond:1200000,audioBitsPerSecond:64000})}catch(e){camErr(e);return}
    CAM.chunks=[];CAM.rec.ondataavailable=e=>{if(e.data&&e.data.size)CAM.chunks.push(e.data)};
    CAM.rec.onstop=async()=>{const type=(CAM.rec&&CAM.rec.mimeType)||mt||'video/webm';const dur=Math.round((nowC()-CAM.t0)/1000);const blob=new Blob(CAM.chunks,{type:type.split(';')[0]});
      const res=CAM.resolve;CAM.resolve=CAM.reject=null;CAM.rec=null;camStop();const hash=await sha256(blob);res({blob,hash,at:new Date(CAM.t0).toISOString(),duration:dur,type:blob.type})};
    CAM.rec.start(1000);$('#camShot').className='shot stop';$('#camRec').classList.remove('hidden');$('#camFlip').classList.add('hidden');
    CAM.timer=setInterval(()=>{const el=Math.floor((nowC()-CAM.t0)/1000);$('#camRec').textContent='● '+el+' / '+maxSec+' ث';$('#camStamp').innerHTML='';if(el>=maxSec&&CAM.rec)CAM.rec.stop()},500)}
})}

function scanCode(expected,title){return new Promise((resolve,reject)=>{
  if(cfg.demo){dlg(`<h3>الوضع التجريبي</h3><p>في الاستخدام الفعلي يُمسح الباركود بالكاميرا. للتجربة اضغط «متابعة».</p><input id="dCode" dir="ltr" value="${esc(expected||'')}"><div class="row" style="margin-top:12px"><button class="btn pri" id="dY">متابعة</button><button class="btn sec" id="dN">إلغاء</button></div>`);$('#dY').onclick=()=>{const v=$('#dCode').value;closeDlg();v?resolve(v):reject(new Error('cancel'))};$('#dN').onclick=()=>{closeDlg();reject(new Error('cancel'))};return}
  if(NB&&NB.scan){window.__scanCb=(txt,err)=>{window.__scanCb=null;txt?resolve(String(txt)):reject(new Error(err||'cancel'))};try{NB.scan(title||'امسح الباركود');}catch(e){reject(e)}return}
  if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){webScan(title).then(resolve,reject);return}
  reject(new Error('unsupported'))})}
async function webScan(title){return new Promise(async(resolve,reject)=>{CAM.resolve=resolve;CAM.reject=reject;
  $('#cam').classList.remove('hidden');$('#scanBox').classList.remove('hidden');$('#camTitle').textContent=title||'امسح الباركود';$('#camStamp').textContent='وجّه الكاميرا نحو الباركود';$('#camShot').className='hidden';$('#camFlip').classList.add('hidden');$('#camSp').classList.remove('hidden');
  try{await camStart('environment',false,true)}catch(e){CAM.reject=null;camErr(e);return reject(e)}
  let det=null;if('BarcodeDetector' in window){try{det=new BarcodeDetector({formats:['code_128','qr_code']})}catch(_){}}
  let busy=false;CAM.scanIv=setInterval(async()=>{if(busy)return;busy=true;try{let v=null;const vid=$('#camV');
    if(det){const r=await det.detect(vid);if(r&&r[0])v=r[0].rawValue}if(!v)v=C128D.decode(vid);
    if(v){const res=CAM.resolve;CAM.resolve=CAM.reject=null;camStop();$('#camShot').className='shot';if(NB&&NB.vibrate)NB.vibrate();else if(navigator.vibrate)navigator.vibrate(80);res(v)}}catch(_){}busy=false},180)})}

    await queue('forms',{taskId:F.tid,formType:F.ins?'inspection':'execution',title,values,photoCats:cats,gps:g,deviceTime:new Date().toISOString(),correctedTime:new Date(nowC()).toISOString(),integrity:integrity()},files,title,'📝');
    const fd=LS.get('formDone',[]);fd.push(F.tid+'|'+myCode());LS.set('formDone',fd);LS.del('draft_'+F.tid);
    for(const c of Object.values(F.photos))for(const p of c){URL.revokeObjectURL(p.url);await IDB.del('drafts',p.id)}
    const tid=F.tid;F=null;closeDlg();show('sTask',false);stack=['sHome'];$('#backBtn').classList.remove('hidden');renderTask(tid);
    toast('✓ تم حفظ الاستمارة. يمكنك الآن تسجيل «إتمام العمل»',4000)}
  catch(e){closeDlg();alertDlg('خطأ',e.message)}};

/* ================= المعوقات ================= */
const OBS_CATS=['الزبون غير متواجد','رفض الزبون / خلاف مع الزبون','نقص في المعدات أو المواد','معدّة تالفة أو غير مطابقة','مشكلة كهربائية في موقع الزبون','السطح أو الموقع غير صالح للتركيب','ظروف جوية','مشكلة في الطريق أو النقل','مشكلة سلامة مهنية','أخرى'];
let O=null;
window.openObs=async tid=>{O={taskId:tid||'',cat:'',sev:'mid',desc:'',sugg:'',clips:[]};
  try{(await IDB.all('drafts')).filter(d=>d.kind==='obs').forEach(d=>{O.clips.push(Object.assign(d,{url:URL.createObjectURL(d.blob)}))});const s=LS.get('obsDraft',null);if(s)Object.assign(O,s,{taskId:tid||s.taskId})}catch(_){}
  O.clips.sort((a,b)=>a.at<b.at?-1:1);show('sObs');renderObs()};
function saveObs(){LS.set('obsDraft',{taskId:O.taskId,cat:O.cat,sev:O.sev,desc:O.desc,sugg:O.sugg})}
function renderObs(){const ts=tasks();
  $('#sObs').innerHTML=`<div class="hint">وضّح المعوّق بفيديو مباشر من موقعك. يُختم كل مقطع بالوقت والموقع لحظة بلحظة، ويمكنك تسجيل عدة مقاطع متتالية لتوثيق تطور المشكلة.</div>
  <div class="card"><h2><span class="n">1</span>المهمة ونوع المعوّق</h2><div class="body">
   <label>المهمة</label><select onchange="O.taskId=this.value;saveObs()"><option value="">— معوّق عام (غير مرتبط بمهمة) —</option>${ts.map(t=>`<option value="${t.id}" ${O.taskId===t.id?'selected':''}>${esc(t.customerName)} – ${t.type==='inspection'?'كشف':'تنفيذ'}</option>`).join('')}</select>
   <label class="req" style="margin-top:10px">نوع المعوّق</label><div class="choice">${OBS_CATS.map(c=>`<button class="${O.cat===c?'on':''}" onclick="O.cat='${c}';saveObs();renderObs()">${c}</button>`).join('')}</div>
   <label style="margin-top:10px">درجة التأثير</label><div class="choice">${[['low','منخفض'],['mid','متوسط – يؤخر العمل'],['high','عالي – يوقف العمل']].map(([k,l])=>`<button class="${O.sev===k?'on':''}" onclick="O.sev='${k}';saveObs();renderObs()">${l}</button>`).join('')}</div></div></div>
  <div class="card"><h2><span class="n">2</span>فيديو وصور التوضيح<span class="mut" style="margin-inline-start:auto;font-weight:400;font-size:12px">${O.clips.length} مرفق</span></h2><div class="body">
   <div class="row"><button class="btn dk" onclick="obsVideo()">🎥 تسجيل فيديو</button><button class="btn sec" onclick="obsPhoto()">📷 صورة</button></div>
   ${O.clips.length?`<div style="margin-top:10px">${O.clips.map((c,i)=>`<div class="log"><span class="i">${c.type.startsWith('video')?'🎥':'📷'}</span><div class="t"><b>${c.type.startsWith('video')?'مقطع فيديو':'صورة'} ${i+1}</b><small>${fmtAr(c.at)}${c.duration?' · '+c.duration+' ثانية':''} · ${(c.blob.size/1048576).toFixed(1)} م.ب</small>
     <input placeholder="وصف مختصر لهذا المقطع (اختياري)" value="${esc(c.caption||'')}" style="margin-top:6px;padding:7px;font-size:14px" onchange="obsCap(${i},this.value)"></div><button class="btn red" style="padding:6px 10px" onclick="obsDel(${i})">✕</button></div>`).join('')}</div>`:'<p class="mut" style="text-align:center;margin:10px 0 0">لم يُسجّل أي مقطع بعد</p>'}</div></div>
  <div class="card"><h2><span class="n">3</span>الوصف</h2><div class="body"><label class="req">وصف المعوّق</label><textarea oninput="O.desc=this.value;saveObs()" placeholder="ماذا حدث؟ متى؟ ما تأثيره على العمل؟">${esc(O.desc)}</textarea>
   <label style="margin-top:10px">الإجراء أو الحل المقترح</label><textarea oninput="O.sugg=this.value;saveObs()">${esc(O.sugg)}</textarea></div></div>`;
  setBar(`<button class="btn pri" onclick="submitObs()">إرسال البلاغ إلى الإدارة</button>`)}
async function obsAdd(r){const g=await getGps(6000);const d={id:rid('ob'),kind:'obs',blob:r.blob,hash:r.hash,at:r.at,duration:r.duration||0,type:r.type,gps:g&&g.lat!=null?g:null,caption:''};await IDB.put('drafts',d);d.url=URL.createObjectURL(r.blob);O.clips.push(d);renderObs()}
window.obsVideo=async()=>{const b=busy('جارٍ تحديد الموقع…');const g=await getGps(6000);closeDlg();try{const r=await recordVideo({label:'معوّق: '+(O.cat||'توثيق ميداني'),gps:g,maxSec:90,title:'فيديو المعوّق'});await obsAdd(r)}catch(_){}};
window.obsPhoto=async()=>{const g=await getGps(5000);try{const r=await capturePhoto({facing:'environment',label:'معوّق: '+(O.cat||'توثيق ميداني'),gps:g,title:'صورة المعوّق'});await obsAdd(r)}catch(_){}};
window.obsCap=async(i,v)=>{const c=O.clips[i];c.caption=v;const {url,...rest}=c;await IDB.put('drafts',rest)};
window.obsDel=async i=>{if(!(await confirmDlg('حذف المرفق؟','','حذف','إلغاء')))return;const c=O.clips.splice(i,1)[0];URL.revokeObjectURL(c.url);await IDB.del('drafts',c.id);renderObs()};
window.submitObs=async()=>{if(!O.cat)return toast('اختر نوع المعوّق');if(!O.desc.trim())return toast('اكتب وصف المعوّق');
  if(!O.clips.some(c=>c.type.startsWith('video'))&&!(await confirmDlg('بدون فيديو؟','يُفضّل تسجيل فيديو يوضح المعوّق. هل تريد الإرسال بدونه؟','إرسال','تسجيل فيديو')))return;
  const b=busy('جارٍ حفظ البلاغ…');
  try{const g=await getGps(8000);const files=[],timeline=[];O.clips.forEach((c,i)=>{const ext=c.type.includes('mp4')?'.mp4':c.type.startsWith('video')?'.webm':'.jpg';const name=(c.type.startsWith('video')?'video_':'photo_')+(i+1)+ext;files.push({field:c.type.startsWith('video')?'video':'photo',name,blob:c.blob,hash:c.hash});timeline.push({name,at:c.at,duration:c.duration,gps:c.gps,caption:c.caption||''})});
    const t=taskById(O.taskId);
    await queue('obstacles',{taskId:O.taskId||null,category:O.cat,severity:O.sev,description:O.desc,suggestion:O.sugg,timeline,gps:g,deviceTime:new Date().toISOString(),correctedTime:new Date(nowC()).toISOString(),integrity:integrity()},files,'معوّق: '+O.cat+(t?' – '+t.customerName:''),'⚠️');
    for(const c of O.clips){URL.revokeObjectURL(c.url);await IDB.del('drafts',c.id)}LS.del('obsDraft');O=null;closeDlg();goBack().then(r=>{if(!r){show('sHome',false);renderHome()}});toast('✓ تم حفظ البلاغ وجارٍ إرساله',3500)}
  catch(e){closeDlg();alertDlg('خطأ',e.message)}};

/* ================= رفع التقارير والاستمارات ================= */
const REP_KINDS=['تقرير يومي','تقرير إنجاز','استمارة موقّعة','عقد / مستند الزبون','وصل / فاتورة','طلب مواد','أخرى'];
let R=null;
window.openReport=tid=>{R={taskId:tid||'',kind:'تقرير يومي',title:'',notes:'',files:[]};show('sReport');renderReport()};
function renderReport(){const ts=tasks();
  $('#sReport').innerHTML=`<div class="card"><h2><span class="n">1</span>بيانات التقرير</h2><div class="body">
   <label class="req">النوع</label><div class="choice">${REP_KINDS.map(k=>`<button class="${R.kind===k?'on':''}" onclick="R.kind='${k}';renderReport()">${k}</button>`).join('')}</div>
   <label style="margin-top:10px">المهمة</label><select onchange="R.taskId=this.value"><option value="">— غير مرتبط بمهمة —</option>${ts.map(t=>`<option value="${t.id}" ${R.taskId===t.id?'selected':''}>${esc(t.customerName)}</option>`).join('')}</select>
   <label class="req" style="margin-top:10px">العنوان</label><input value="${esc(R.title)}" oninput="R.title=this.value" placeholder="مثال: تقرير عمل يوم ${todayStr()}">
   <label style="margin-top:10px">الملاحظات</label><textarea oninput="R.notes=this.value">${esc(R.notes)}</textarea></div></div>
  <div class="card"><h2><span class="n">2</span>الملفات<span class="mut" style="margin-inline-start:auto;font-weight:400;font-size:12px">${R.files.length} ملف</span></h2><div class="body">
   <div class="row"><button class="btn dk" onclick="$('#fPick').click()">📎 اختيار ملفات</button><button class="btn sec" onclick="repCam()">📷 تصوير مستند</button></div>
   <p class="mut">PDF · Word · Excel · صور</p>${R.files.map((f,i)=>`<div class="log"><span class="i">${f.blob.type.startsWith('image')?'🖼️':'📄'}</span><div class="t">${esc(f.name)}<small>${(f.blob.size/1024).toFixed(0)} ك.ب${f.live?' · مُلتقطة من التطبيق':''}</small></div><button class="btn red" style="padding:6px 10px" onclick="R.files.splice(${i},1);renderReport()">✕</button></div>`).join('')}</div></div>`;
  setBar(`<button class="btn pri" onclick="submitReport()">رفع إلى النظام</button>`)}
$('#fPick').onchange=e=>{[...e.target.files].forEach(f=>{if(f.size>50*1048576)return toast('الملف '+f.name+' أكبر من 50 م.ب');R.files.push({name:f.name,blob:f})});e.target.value='';renderReport()};
window.repCam=async()=>{try{const g=await getGps(5000);const r=await capturePhoto({facing:'environment',label:R.kind,gps:g,title:'تصوير مستند'});R.files.push({name:'doc_'+Date.now()+'.jpg',blob:r.blob,hash:r.hash,live:true});renderReport()}catch(_){}};
window.submitReport=async()=>{if(!R.title.trim())return toast('اكتب عنوان التقرير');if(!R.files.length)return toast('أضف ملفاً واحداً على الأقل');
  const b=busy('جارٍ الحفظ…');try{const g=await getGps(6000);
    await queue('reports',{taskId:R.taskId||null,kind:R.kind,title:R.title,notes:R.notes,gps:g,deviceTime:new Date().toISOString(),correctedTime:new Date(nowC()).toISOString()},R.files.map(f=>({field:'file',name:f.name,blob:f.blob,hash:f.hash})),R.kind+': '+R.title,'📤');
    R=null;closeDlg();goBack().then(r=>{if(!r){show('sHome',false);renderHome()}});toast('✓ تم حفظ التقرير وجارٍ رفعه',3500)}catch(e){closeDlg();alertDlg('خطأ',e.message)}};

/* ================= السجل والإعدادات ================= */
const ST={pending:['⏳','بانتظار الإرسال'],sent:['✅','أُرسل إلى النظام'],error:['❌','رفضه الخادم – سيُعاد المحاولة']};
function renderLog(){const l=logAll();
  $('#sLog').innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn pri" onclick="sync(true)">↻ إرسال المعلّق الآن</button></div>
  <div class="card">${l.length?l.map(x=>`<div class="log"><span class="i">${x.icon||'📄'}</span><div class="t"><b style="font-size:15px">${esc(x.title)}</b><small>${fmtAr(x.at)} · ${ST[x.status]?ST[x.status][0]+' '+ST[x.status][1]:x.status}</small>${(x.flags||[]).map(f=>`<span class="flag">⚠ ${esc(f)}</span>`).join('')}</div></div>`).join(''):'<div class="body mut" style="text-align:center">لا توجد عمليات بعد</div>'}</div>`}
async function renderSet(){const e=cfg.employee||{};const n=await pendingCount();
  $('#sSet').innerHTML=`<div class="card"><h2>الحساب</h2><div class="body kv"><div>الموظف</div><div>${esc(e.name)} (${esc(e.code)})</div><div>الخادم</div><div dir="ltr" style="text-align:right">${esc(cfg.demo?'وضع تجريبي':cfg.server)}</div>
  <div>معرّف الجهاز</div><div class="mut" dir="ltr" style="text-align:right">${esc(cfg.deviceId)}</div><div>الوقت الموثوق</div><div>${fmtDT(nowC())}</div><div>بانتظار الإرسال</div><div>${n}</div></div></div>
  <div class="row" style="margin-bottom:10px"><button class="btn pri" onclick="sync(true)">↻ مزامنة الآن</button><button class="btn sec" onclick="pullTasks()">تحديث المهام</button></div>
  <button class="btn red w" onclick="logout()">تسجيل الخروج</button>
  <div class="foot">تطبيق الموظف الميداني – الإصدار 1.0<br>ALTAKA-ALWATANIYAH</div>`}
window.logout=async()=>{const n=await pendingCount();if(!(await confirmDlg('تسجيل الخروج؟',n?`يوجد ${n} سجل لم يُرسل بعد. سيبقى محفوظاً على الهاتف ويُرسل عند دخولك مجدداً بنفس الحساب.`:'سيتم الخروج من الحساب.','خروج','إلغاء')))return;
  if(cfg.token&&!cfg.demo)fetchT(cfg.server+'/api/mobile/logout',{method:'POST',headers:{Authorization:'Bearer '+cfg.token}},5000).catch(()=>{});
  cfg.token=null;cfg.demo=false;cfg.employee=null;saveCfg();$('#demoBar').classList.add('hidden');show('sLogin',false)};

/* ================= البدء ================= */
(function start(){if(cfg.demo&&cfg.employee){$('#demoBar').classList.remove('hidden');boot=boot||demoBoot();show('sHome',false);renderHome();return}
  if(cfg.token&&cfg.employee&&boot){show('sHome',false);renderHome();refresh(true).then(ok=>{if(ok&&cur()==='sHome')renderHome()});sync();return}
  show('sLogin',false)})();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!NB)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
