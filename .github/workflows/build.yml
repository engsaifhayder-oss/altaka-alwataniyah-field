name: Build unified app (Android + Windows + macOS + iOS web) + Windows server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Copy web app into Android assets
        run: mkdir -p app/src/main/assets && cp index.html erp-bridge.js app/src/main/assets/ && cp -r tools app/src/main/assets/
      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk altaka-alwataniyah-field.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: altaka-alwataniyah-field.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Copy web app
        shell: bash
        run: mkdir -p desktop/app && cp -r index.html erp-bridge.js icon-192.png icon-512.png tools desktop/app/
      - name: Build Windows installer + portable
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/dist/altaka-alwataniyah-field-setup.exe
            desktop/dist/altaka-alwataniyah-field-portable.exe
            desktop/dist/altaka-alwataniyah-field-windows.zip

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Windows server (gateway + admin + web app + installer)
        run: |
          node --check erp-gateway/server.js
          mkdir -p erp-gateway/public/app
          cp -r index.html erp-bridge.js erp-mobile.css erp.webmanifest manifest.json sw.js icon-180.png icon-192.png icon-512.png tools erp-gateway/public/app/
          rm -rf erp-gateway/data
          cp "server-windows/دليل-الخادم-والتطبيق-الموحد.txt" erp-gateway/
          mkdir -p pkg/ALTAKA-ALWATANIYAH-Server-Windows
          cp -r erp-gateway pkg/ALTAKA-ALWATANIYAH-Server-Windows/gateway
          cp server-windows/* pkg/ALTAKA-ALWATANIYAH-Server-Windows/
          (cd pkg && zip -r ../ALTAKA-ALWATANIYAH-Server-Windows.zip ALTAKA-ALWATANIYAH-Server-Windows)
          zip -r altaka-alwataniyah-field-gateway.zip erp-gateway
      - name: Package accounting program (Windows server)
        run: |
          node --check accounting/server.js
          A=pkg/ALTAKA-ALWATANIYAH-Accounting-Server-Windows
          mkdir -p $A/accounting
          cp -r accounting/server.js accounting/chart.js accounting/start-windows.bat accounting/public $A/accounting/
          cp accounting/install-accounting-windows.bat "accounting/دليل-برنامج-الحسابات.txt" $A/
          (cd pkg && zip -r ../ALTAKA-ALWATANIYAH-Accounting-Server-Windows.zip ALTAKA-ALWATANIYAH-Accounting-Server-Windows)
      - uses: actions/upload-artifact@v4
        with:
          name: gateway
          path: |
            ALTAKA-ALWATANIYAH-Server-Windows.zip
            ALTAKA-ALWATANIYAH-Accounting-Server-Windows.zip
            altaka-alwataniyah-field-gateway.zip

  # نسخة الآيفون: تطبيق ويب يُضاف إلى الشاشة الرئيسية من Safari
  ios-web:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p _site && cp -r index.html erp-bridge.js manifest.json sw.js icon-*.png .nojekyll tools _site/
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 40
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

  release:
    needs: [ android, windows, gateway ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          rm -f out/artifact.tar
          ls -la out
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* \
            --title "منظومة ERP – الطاقة الوطنية – الإصدار 3.${{ github.run_number }}" \
            --notes "برنامج واحد: منظومة ERP مع العمل الميداني (الحضور، الكشف، التنفيذ، المعوقات، التقارير) حسب صفة الموظف — الدخول باسم مستخدم ERP فقط · أندرويد: altaka-alwataniyah-field.apk · ويندوز: altaka-alwataniyah-field-setup.exe أو altaka-alwataniyah-field-portable.exe · ماك: altaka-alwataniyah-field-mac-arm64.dmg (M1–M4) أو altaka-alwataniyah-field-mac-x64.dmg (Intel) — تُضاف بعد اكتمال بنائها · الآيفون: افتح https://app.altaka-field.com/erp/ في Safari ثم «إضافة إلى الشاشة الرئيسية» · خادم الحاسبة الأم (ويندوز): ALTAKA-ALWATANIYAH-Server-Windows.zip ← install-server-windows.bat كمسؤول · برنامج الحسابات: ALTAKA-ALWATANIYAH-Accounting-Server-Windows.zip ← install-accounting-windows.bat كمسؤول، ثم https://acc.altaka-field.com" \
            --latest
